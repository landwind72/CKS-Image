<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="portrait">
<title>Camera Module</title>
<script src="camera.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

/* Camera chiếm toàn bộ màn hình */
#cam-wrap {
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
camera-scanner {
  flex: 1;
  min-height: 0;
  display: block;
}

/* Thanh trạng thái mỏng phía dưới */
#statusbar {
  flex-shrink: 0;
  background: rgba(0,0,0,0.85);
  color: rgba(255,255,255,0.6);
  font-size: 11px;
  padding: 5px 14px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 5px);
  text-align: center;
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#statusbar .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
}
#statusbar .dot.ok  { background: #2ecc71; }
#statusbar .dot.err { background: #e74c3c; }

/* Nút Hủy nổi góc trên trái */
#btn-cancel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 14px;
  z-index: 99;
  background: rgba(0,0,0,0.65);
  color: rgba(255,255,255,0.85);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
#btn-cancel:active { opacity: 0.7; }
</style>
</head>
<body>

<div id="cam-wrap">
  <camera-scanner id="cam"></camera-scanner>
  <div id="statusbar">
    <div class="dot" id="dot"></div>
    <span id="stxt">Đang khởi động camera...</span>
  </div>
</div>

<button id="btn-cancel" onclick="doCancel()">✕ Hủy</button>

<script>
// ── ĐỌC PARAMS TỪ URL ──────────────────────────────────────────
// App local truyền config qua query string:
// ?frame=circle&frame-color=%23e74c3c&auto-capture=true&...
const params  = new URLSearchParams(location.search);
const CALLER  = params.get('caller') || '*';  // origin của app gọi

// Danh sách attribute hợp lệ sẽ chuyển sang component
const VALID_ATTRS = [
  'frame', 'frame-color', 'frame-size', 'show-grid', 'show-guide',
  'auto-capture', 'sharpness-threshold', 'sharpness-bar',
  'output', 'max-width', 'quality', 'grayscale', 'crop-to-frame',
  'facing', 'hint', 'continuous', 'continuous-interval',
  'hide-controls', 'ui',
];

// ── ÁP DỤNG CONFIG VÀO COMPONENT ──────────────────────────────
const cam = document.getElementById('cam');

// Giá trị mặc định nếu app không truyền
cam.setAttribute('output',        params.get('output')        || 'base64');
cam.setAttribute('ui',            params.get('ui')            || 'true');
cam.setAttribute('sharpness-bar', params.get('sharpness-bar') || 'false');

// Áp dụng tất cả params hợp lệ từ URL
VALID_ATTRS.forEach(attr => {
  const val = params.get(attr);
  if (val !== null) cam.setAttribute(attr, val);
});

// ── NHẬN LỆNH TỪ APP LOCAL QUA postMessage ────────────────────
// App local có thể gửi lệnh sau khi module đã load:
// { action: 'capture' }  → chụp ngay
// { action: 'stop' }     → dừng camera
// { action: 'setFrame', frame: 'oval' }
window.addEventListener('message', e => {
  // Bỏ qua nếu không phải từ caller đúng (trừ wildcard)
  if (CALLER !== '*' && e.origin !== CALLER) return;

  const { action, frame } = e.data || {};
  if (action === 'capture')  cam.capture();
  if (action === 'stop')     { cam.stop(); }
  if (action === 'setFrame') cam.setFrame(frame);
});

// ── GỬI KẾT QUẢ VỀ APP LOCAL ──────────────────────────────────
function post(data) {
  // window.parent  = nếu dùng trong iframe
  // window.opener  = nếu dùng popup window.open()
  // Gửi cả hai để không cần quan tâm cách gọi
  const target = window.opener || window.parent;
  if (target && target !== window) {
    target.postMessage(data, CALLER);
  }
}

// ── LẮNG NGHE EVENTS TỪ camera.js ─────────────────────────────
cam.addEventListener('camera-ready', e => {
  setSts(`Camera sẵn sàng ✓  ${e.detail.width}×${e.detail.height}`, 'ok');
  post({ type: 'camera_ready', width: e.detail.width, height: e.detail.height });
});

cam.addEventListener('camera-result', e => {
  setSts('Đã chụp — đang gửi về app...', 'ok');
  // Gửi toàn bộ detail về app local
  post({
    type      : 'camera_result',
    dataUrl   : e.detail.dataUrl,
    blob      : null,             // Blob không serialize qua postMessage được
    sharpness : e.detail.sharpness,
    frameType : e.detail.frameType,
    width     : e.detail.width,
    height    : e.detail.height,
    timestamp : e.detail.timestamp,
  });
  // Tự đóng sau 300ms (nếu là popup)
  // Nếu là iframe thì app local tự ẩn iframe
  setTimeout(() => { if (window.opener) window.close(); }, 300);
});

cam.addEventListener('camera-error', e => {
  setSts(e.detail.message, 'err');
  post({ type: 'camera_error', code: e.detail.code, message: e.detail.message, recoverable: e.detail.recoverable });
});

cam.addEventListener('sharpness-change', e => {
  // Chỉ forward sharpness nếu app cần (tránh spam postMessage)
  if (params.get('report-sharpness') === 'true') {
    post({ type: 'sharpness_change', value: e.detail.value });
  }
});

// ── NÚT HỦY ───────────────────────────────────────────────────
function doCancel() {
  cam.stop();
  post({ type: 'camera_cancel' });
  setTimeout(() => { if (window.opener) window.close(); }, 100);
}

// ── TIỆN ÍCH ──────────────────────────────────────────────────
function setSts(msg, state) {
  document.getElementById('stxt').textContent = msg;
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (state ? ' ' + state : '');
}
</script>
</body>
</html>
